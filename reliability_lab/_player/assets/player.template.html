<body>
<main class="window" id="app">
<div class="chrome"><span class="traffic" aria-hidden="true"><i></i><i></i><i></i></span><span class="window-title" id="window-title"></span><span class="chrome-badge" id="badge"></span></div>

<script>
(() => {
'use strict';
const DATA=JSON.parse(document.getElementById('diagram-data').textContent);
const C={cyan:'#95d5ee',green:'#9ad6b8',blue:'#9dbce5',purple:'#c6b6ef',pink:'#e5acc5',red:'#ee9ca7'};
const W=DATA.canvas.width,H=DATA.canvas.height,$=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';

const html=(tag,cls,text,parent)=>{const e=document.createElement(tag);e.className=cls;if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e;};

document.title=DATA.title;$('heading').textContent=DATA.title;$('subtitle').textContent=DATA.subtitle||'EXECUTION TRACE';$('window-title').textContent=DATA.windowTitle||'architecture / execution.trace';
$('app').style.maxWidth=(W+34)+'px';$('help').style.maxWidth=(W+34)+'px';Object.assign($('stage').style,{width:W+'px',height:H+'px'});$('wires').setAttribute('viewBox',`0 0 ${W} ${H}`);Object.assign($('wires').style,{width:W+'px',height:H+'px'});
(DATA.legend||[]).forEach(item=>{const e=html('span','',undefined,$('legend'));e.style.setProperty('--accent',color(item.color));html('b','',undefined,e);e.append(document.createTextNode(item.label));});
const nodes={};
DATA.nodes.forEach(n=>{
 const [x,y,w,h]=n.bounds,e=html('article','node',undefined,$('stage'));e.id='node-'+n.id;e.dataset.node=n.id;e.dataset.kind=n.kind||'main';e.style.setProperty('--accent',color(n.color));Object.assign(e.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
 const head=html('div','node-heading',undefined,e);html('h2','node-title',n.title,head);const state=html('span','state',n.state||'',head);
 if(n.subtitle)html('div','node-subtitle',n.subtitle,e);
 if(n.lines?.length){const lines=html('div','node-lines',undefined,e);n.lines.forEach(line=>html('div','',line,lines));}
 if(n.rows?.length){const rows=html('div','rows',undefined,e);n.rows.forEach(r=>{const row=html('div','row',undefined,rows);html('span','row-label',r.label,row);html('span','row-value',r.value,row);});}
 const meters={};if(n.meters?.length){const box=html('div','meters',undefined,e);n.meters.forEach(m=>{const row=html('div','meter',undefined,box);row.dataset.meter=m.id;html('span','meter-label',m.label,row);const track=html('span','meter-track',undefined,row),bar=html('i','',undefined,track),number=html('span','meter-number','',row);meters[m.id]={row,bar,number,data:m};});}
 const operation=html('div','operation',n.operation||'',e),footer=html('div','node-footer',n.footer||'',e);nodes[n.id]={element:e,state,operation,footer,meters,data:n};
});
const rounded=points=>{let d=`M ${points[0][0]} ${points[0][1]}`;for(let i=1;i<points.length-1;i++){const a=points[i-1],b=points[i],c=points[i+1],la=Math.hypot(b[0]-a[0],b[1]-a[1]),lb=Math.hypot(c[0]-b[0],c[1]-b[1]),r=Math.min(8,la/2,lb/2);d+=` L ${b[0]-(b[0]-a[0])/la*r} ${b[1]-(b[1]-a[1])/la*r} Q ${b[0]} ${b[1]} ${b[0]+(c[0]-b[0])/lb*r} ${b[1]+(c[1]-b[1])/lb*r}`;}const end=points.at(-1);return d+` L ${end[0]} ${end[1]}`;};
const marker=(id,t)=>{const m=svg('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:10,markerHeight:10,orient:'auto',markerUnits:'userSpaceOnUse'},$('wire-defs'));svg('path',{d:'M 1 1 L 9 5 L 1 9 Z',fill:t},m);};marker('arrow-muted','#53616e');Object.entries(C).forEach(([k,v])=>marker('arrow-'+k,v));
const glow=svg('filter',{id:'packet-glow',x:'-200%',y:'-200%',width:'500%',height:'500%'},$('wire-defs'));svg('feGaussianBlur',{stdDeviation:3},glow);
const routes={};DATA.routes.forEach((r,index)=>{const tone=r.color||nodes[r.source].data.color||'cyan',d=rounded(r.points),g=svg('g',{class:'route','data-route':r.id,style:'--flow-color:'+color(tone)},$('route-layer')),base=svg('path',{d,class:'wire-base','marker-end':'url(#arrow-muted)'},g),active=svg('path',{d,class:'wire-active',stroke:color(tone),'marker-end':`url(#arrow-${tone})`},g),pack=svg('g',{class:'packet'},g);
 const halo=svg('circle',{r:8,fill:color(tone),opacity:.5,filter:'url(#packet-glow)'},pack),dot=svg('circle',{r:3.5,fill:color(tone)},pack),core=svg('circle',{r:1.25,fill:'#eefbff'},pack),tails=[.65,.35,.17].map((opacity,i)=>svg('circle',{r:2.2-i*.35,fill:color(tone),opacity},pack));
 [r.points[0],r.points.at(-1)].forEach(([cx,cy])=>svg('circle',{cx,cy,r:2.7,class:'port'},g));let caption=null;if(r.label){caption=html('span','route-caption',r.label,$('stage'));caption.dataset.routeCaption=r.id;caption.style.setProperty('--flow-color',color(tone));Object.assign(caption.style,{left:r.labelAt[0]+'px',top:r.labelAt[1]+'px'});}routes[r.id]={group:g,base,active,halo,dot,core,tails,caption,index,data:r,length:base.getTotalLength()};
});
const starts=[];let duration=0;DATA.steps.forEach(s=>{starts.push(duration);duration+=s.duration;});$('scrubber').max=duration;$('badge').textContent=(DATA.simulated===false?'● 执行记录':'● 演示数据')+' · '+duration+' 秒';
const buttons=DATA.steps.map((s,i)=>{const b=html('button','',String(i+1).padStart(2,'0')+' '+(s.shortLabel||s.label),$('step-rail'));b.type='button';b.title=s.label;b.addEventListener('click',()=>seek(starts[i]));return b;});
let current=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,loop=true,last=performance.now(),manualZoom=null,scale=1,lastStep=-1;
const locate=t=>{const value=Math.max(0,Math.min(t,duration-1e-7));let index=DATA.steps.length-1;while(index>0&&starts[index]>value)index--;return{index,step:DATA.steps[index],progress:(value-starts[index])/DATA.steps[index].duration};};
const clock=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function render(){const {step,index,progress}=locate(current);
 Object.entries(nodes).forEach(([id,n])=>{const s=step.nodeStates?.[id]||{};n.element.classList.toggle('is-active',(step.activeNodes||[]).includes(id));n.state.textContent=s.state??n.data.state??'';n.state.dataset.tone=s.tone||'normal';n.operation.textContent=s.operation??n.data.operation??'';n.footer.textContent=s.footer??n.data.footer??'';
 Object.entries(n.meters).forEach(([mid,m])=>{const value=s.meterValues?.[mid]??m.data.value;m.bar.style.width=value*100+'%';m.number.textContent=value.toFixed(2);m.row.classList.toggle('is-selected',s.selectedMeter===mid);m.row.classList.toggle('is-warning',m.data.warningBelow!==undefined&&value<m.data.warningBelow);});});
 Object.entries(routes).forEach(([id,r])=>{const enabled=(step.activeRoutes||[]).includes(id);r.group.classList.toggle('is-active',enabled);if(r.caption){r.caption.classList.toggle('is-active',enabled);r.caption.textContent=step.routeLabels?.[id]??r.data.label;}r.active.style.strokeDashoffset=-current*18;if(!enabled)return;const start=Math.min(7,r.length/4),end=Math.max(start,r.length-14),travel=(progress*1.4+r.index*.17)%1,distance=start+travel*(end-start),point=r.base.getPointAtLength(distance);[r.dot,r.core,r.halo].forEach(c=>{c.setAttribute('cx',point.x);c.setAttribute('cy',point.y);});r.tails.forEach((c,i)=>{const at=distance-(i+1)*7;c.style.display=at>=start?'':'none';const p=r.base.getPointAtLength(Math.max(start,at));c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);});});
 $('step-number').textContent=String(index+1).padStart(2,'0')+' / '+DATA.steps.length;$('phase-label').textContent=step.label;$('phase-label').title=step.label;if(lastStep!==index){$('trace-log').textContent=step.description||'';lastStep=index;}$('elapsed').textContent=clock(current)+' / '+clock(duration);$('scrubber').value=current;$('scrubber').setAttribute('aria-valuetext',step.label+'，'+current.toFixed(1)+'秒');$('toggle').textContent=paused?'▶ 播放':'Ⅱ 暂停';$('toggle').setAttribute('aria-label',paused?'继续播放':'暂停播放');$('previous').disabled=index===0;$('next').disabled=index===DATA.steps.length-1;buttons.forEach((b,i)=>{b.classList.toggle('is-current',i===index);b.setAttribute('aria-current',i===index?'step':'false');});}
function seek(t){if(!Number.isFinite(Number(t)))return;current=Math.max(0,Math.min(Number(t),duration));paused=true;last=performance.now();render();}function toggle(){if(current>=duration)current=0;paused=!paused;last=performance.now();render();}function next(delta){const {index}=locate(current);seek(starts[Math.max(0,Math.min(DATA.steps.length-1,index+delta))]);}function restart(){current=0;paused=false;last=performance.now();render();}
function fitScale(){const full=Boolean(document.fullscreenElement),body=getComputedStyle(document.body),margin=full?0:parseFloat(body.paddingTop)+parseFloat(body.paddingBottom)+$('help').getBoundingClientRect().height+17,room=innerHeight-document.querySelector('.chrome').getBoundingClientRect().height-document.querySelector('.controls').getBoundingClientRect().height-margin;return Math.max(.2,Math.min(1,$('viewport').clientWidth/W,room/H));}
function resize(){scale=manualZoom??Math.max(.7,fitScale());$('stage').style.transform='scale('+scale+')';$('stage-wrap').style.width=W*scale+'px';$('stage-wrap').style.height=H*scale+'px';$('zoom-out').disabled=scale<=.3;$('zoom-in').disabled=scale>=1.5;}const zoom=d=>{manualZoom=Math.max(.3,Math.min(1.5,scale+d));resize();};
$('toggle').addEventListener('click',toggle);$('previous').addEventListener('click',()=>next(-1));$('next').addEventListener('click',()=>next(1));$('restart').addEventListener('click',restart);$('scrubber').addEventListener('input',e=>seek(e.target.value));$('speed').addEventListener('change',e=>speed=Number(e.target.value));$('loop').addEventListener('change',e=>loop=e.target.checked);$('zoom-out').addEventListener('click',()=>zoom(-.1));$('zoom-in').addEventListener('click',()=>zoom(.1));$('fit').addEventListener('click',()=>{manualZoom=fitScale();resize();$('viewport').scrollLeft=0;});$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('app').requestFullscreen();}catch{$('fullscreen').textContent='全屏不可用';}});document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏';resize();});
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea')||e.metaKey||e.ctrlKey||e.altKey)return;if(e.code==='Space'&&e.target.matches('button'))return;if(e.code==='Space'){e.preventDefault();toggle();}else if(e.key==='ArrowRight'){e.preventDefault();next(1);}else if(e.key==='ArrowLeft'){e.preventDefault();next(-1);}else if(e.key.toLowerCase()==='r')restart();});
let resizePending=false;const scheduleResize=()=>{if(resizePending)return;resizePending=true;requestAnimationFrame(()=>{resizePending=false;resize();});};
